<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000"><link rel="manifest" href="/manifest.json">
<title>Cast-O-Matic • Display</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,Arial,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#090d16;border-bottom:1px solid #1f2937;flex-shrink:0}.brand{font-weight:800}.room{font-size:13px;color:#94a3b8}
#screen{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;position:relative}iframe,video{width:100%;height:100%;border:0;object-fit:contain;background:#000}#placeholder{text-align:center;color:#94a3b8;padding:25px}#placeholder h1{color:#fff;font-size:clamp(24px,5vw,48px)}#placeholder p{font-size:clamp(14px,2vw,20px)}
#enter{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 14px;border:1px solid #334155;background:#111827;color:#fff;border-radius:10px;display:none;z-index:5}.file-info{position:absolute;top:12px;left:12px;right:12px;z-index:4;display:none;background:rgba(15,23,42,.86);backdrop-filter:blur(8px);border:1px solid #334155;border-radius:10px;padding:9px 12px;font-size:13px}.file-info b{color:#fff}.download{color:#93c5fd;text-decoration:none;margin-left:8px}
@media(max-width:600px){header{height:44px;padding:0 10px}}
</style></head>
<body>
<header><div class="brand">📺 Cast-O-Matic Display</div><div class="room">Room: <b id="room">{{ room or "—" }}</b></div></header>
<div id="screen"><div id="placeholder"><h1>Ready to receive</h1><p>Waiting for the presenter to send a file or start a live cast.</p></div><div id="fileInfo" class="file-info"></div><iframe id="pdf" style="display:none" title="Presentation"></iframe><iframe id="office" style="display:none" title="Office document"></iframe><img id="image" style="display:none;max-width:100%;max-height:100%;object-fit:contain" alt="Shared image"><video id="video" autoplay playsinline controls style="display:none"></video><audio id="audio" controls style="display:none;max-width:90%"></audio><pre id="text" style="display:none;white-space:pre-wrap;max-width:90%;max-height:90%;overflow:auto;background:#111827;padding:20px;border-radius:12px"></pre><button id="enter">Tap to start display</button></div>
<script>
const ROOM={{ room|tojson }};const socket=io();let pc=null,pending=[];const rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
const placeholder=document.getElementById("placeholder"),pdf=document.getElementById("pdf"),office=document.getElementById("office"),image=document.getElementById("image"),video=document.getElementById("video"),audio=document.getElementById("audio"),text=document.getElementById("text"),enter=document.getElementById("enter"),fileInfo=document.getElementById("fileInfo");
function hideAll(){[pdf,office,image,video,audio,text].forEach(x=>x.style.display="none");enter.style.display="none";fileInfo.style.display="none"}
function baseShow(name){hideAll();placeholder.style.display="none";fileInfo.style.display="block";fileInfo.innerHTML='<b>'+escapeHtml(name)+'</b>'}
function fileUrl(f){return "/uploads/"+encodeURIComponent(f)}
function showFile(d){if(!d||!d.filename)return;const url=fileUrl(d.filename);const kind=d.kind;
 if(kind==="pdf"){baseShow(d.original_name);pdf.src=url;pdf.style.display="block";return}
 if(kind==="office"){baseShow(d.original_name);const viewer="https://view.officeapps.live.com/op/view.aspx?src="+encodeURIComponent(location.origin+url);office.src=viewer;office.style.display="block";fileInfo.innerHTML='<b>'+escapeHtml(d.original_name)+'</b><a class="download" href="'+url+'" target="_blank">Open/download</a>';return}
 if(kind==="image"){baseShow(d.original_name);image.src=url;image.style.display="block";return}
 if(kind==="video"){baseShow(d.original_name);video.src=url;video.style.display="block";video.play().catch(()=>{enter.style.display="block"});return}
 if(kind==="audio"){baseShow(d.original_name);audio.src=url;audio.style.display="block";audio.play().catch(()=>{enter.style.display="block"});return}
 if(kind==="text"){baseShow(d.original_name);fetch(url).then(r=>r.text()).then(v=>{text.textContent=v;text.style.display="block"}).catch(()=>{});return}
 baseShow(d.original_name);fileInfo.innerHTML='<b>'+escapeHtml(d.original_name)+'</b><a class="download" href="'+url+'" target="_blank">Download / open</a>'}
function showVideoStream(){hideAll();placeholder.style.display="none";video.style.display="block";video.controls=false;video.muted=true}
function escapeHtml(v){return String(v).replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[m]))}
async function flush(){for(const c of pending){try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch(e){}}pending=[]}
if(!ROOM){placeholder.innerHTML="<h1>Join a room</h1><p>Use the presenter’s room code or link.</p>";}else{
socket.on("connect",()=>socket.emit("join",{room:ROOM,role:"receiver"}));
socket.on("presentation_update",showFile);
socket.on("offer",async offer=>{try{if(pc)pc.close();pending=[];pc=new RTCPeerConnection(rtcConfig);pc.ontrack=e=>{video.srcObject=e.streams[0]||new MediaStream([e.track]);showVideoStream();video.play().catch(()=>{enter.style.display="block"})};pc.onicecandidate=e=>{if(e.candidate)socket.emit("ice-candidate",{room:ROOM,candidate:e.candidate.toJSON()})};pc.onconnectionstatechange=()=>{if(pc&&["failed","disconnected","closed"].includes(pc.connectionState)){placeholder.style.display="block";placeholder.querySelector("p").textContent="Connection ended. Ask the presenter to start the cast again."}};await pc.setRemoteDescription(new RTCSessionDescription(offer));await flush();const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.emit("answer",{room:ROOM,answer:pc.localDescription})}catch(e){placeholder.style.display="block";placeholder.querySelector("p").textContent="Could not connect: "+e.message}});
socket.on("ice-candidate",async d=>{const c=d&&d.candidate;if(!c)return;if(!pc||!pc.remoteDescription){pending.push(c);return}try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch(e){console.error(e)}});
enter.onclick=()=>{if(video.style.display!=="none")video.play().then(()=>enter.style.display="none").catch(()=>{});if(audio.style.display!=="none")audio.play().then(()=>enter.style.display="none").catch(()=>{})};}
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
