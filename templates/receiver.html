<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000"><link rel="manifest" href="/manifest.json">
<title>Cast-O-Matic • Display</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,Arial,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#090d16;border-bottom:1px solid #1f2937;flex-shrink:0}.brand{font-weight:800}.room{font-size:13px;color:#94a3b8}
#screen{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;position:relative}iframe,video{width:100%;height:100%;border:0;object-fit:contain;background:#000}#placeholder{text-align:center;color:#94a3b8;padding:25px}#placeholder h1{color:#fff;font-size:clamp(24px,5vw,48px)}#placeholder p{font-size:clamp(14px,2vw,20px)}
#enter{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 14px;border:1px solid #334155;background:#111827;color:#fff;border-radius:10px;display:none}
@media(max-width:600px){header{height:44px;padding:0 10px}}
</style></head>
<body>
<header><div class="brand">📺 Cast-O-Matic Display</div><div class="room">Room: <b id="room">{{ room or "—" }}</b></div></header>
<div id="screen"><div id="placeholder"><h1>Ready to receive</h1><p>Waiting for the presenter to upload a PDF or start a live cast.</p></div><iframe id="pdf" style="display:none" title="Presentation"></iframe><video id="video" autoplay playsinline muted style="display:none"></video><button id="enter">Tap to start display</button></div>
<script>
const ROOM={{ room|tojson }};const socket=io();let pc=null,pending=[];const rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
const placeholder=document.getElementById("placeholder"),pdf=document.getElementById("pdf"),video=document.getElementById("video"),enter=document.getElementById("enter");
function showPDF(f){placeholder.style.display="none";video.style.display="none";enter.style.display="none";pdf.style.display="block";pdf.src="/uploads/"+encodeURIComponent(f)}
function showVideo(){placeholder.style.display="none";pdf.style.display="none";video.style.display="block";enter.style.display="none"}
async function flush(){for(const c of pending){try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch(e){}}pending=[]}
if(!ROOM){placeholder.innerHTML="<h1>Join a room</h1><p>Use the presenter’s room code or link.</p>";}
else{
socket.on("connect",()=>socket.emit("join",{room:ROOM,role:"receiver"}));
socket.on("presentation_update",d=>{if(d&&d.filename)showPDF(d.filename)});
socket.on("offer",async offer=>{try{if(pc)pc.close();pending=[];pc=new RTCPeerConnection(rtcConfig);pc.ontrack=e=>{video.srcObject=e.streams[0]||new MediaStream([e.track]);showVideo();video.play().catch(()=>{enter.style.display="block"})};pc.onicecandidate=e=>{if(e.candidate)socket.emit("ice-candidate",{room:ROOM,candidate:e.candidate.toJSON()})};pc.onconnectionstatechange=()=>{if(pc&&["failed","disconnected","closed"].includes(pc.connectionState)){placeholder.style.display="block";placeholder.querySelector("p").textContent="Connection ended. Ask the presenter to start the cast again."}};await pc.setRemoteDescription(new RTCSessionDescription(offer));await flush();const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.emit("answer",{room:ROOM,answer:pc.localDescription})}catch(e){placeholder.style.display="block";placeholder.querySelector("p").textContent="Could not connect: "+e.message}});
socket.on("ice-candidate",async d=>{const c=d&&d.candidate;if(!c)return;if(!pc||!pc.remoteDescription){pending.push(c);return}try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch(e){console.error(e)}});
enter.onclick=()=>video.play().then(()=>enter.style.display="none").catch(()=>{});
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
