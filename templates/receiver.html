<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#000">
<link rel="manifest" href="/manifest.json">
<title>Cast-O-Matic | Display</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}
header{height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;background:#090d16;border-bottom:1px solid #202b3c;flex-shrink:0}.brand{font-weight:800}.room{font-size:13px;color:#9aa9bf}
#screen{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;position:relative}.content{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.content iframe,.content video{width:100%;height:100%;border:0;object-fit:contain;background:#000}.content img{max-width:100%;max-height:100%;object-fit:contain}.content audio{max-width:80%}.content pre{max-width:90%;max-height:90%;overflow:auto;background:#101827;padding:22px;border-radius:12px;white-space:pre-wrap}
#placeholder{text-align:center;color:#91a0b5;padding:28px}.placeholder-title{font-size:clamp(28px,5vw,56px);font-weight:800;color:#fff;margin-bottom:10px}.placeholder-sub{font-size:clamp(14px,2vw,19px)}
.toolbar{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:10}.tool{border:1px solid #344258;background:rgba(10,15,25,.88);color:#fff;border-radius:9px;padding:9px 11px;cursor:pointer}.file-info{position:absolute;top:12px;left:12px;max-width:60%;z-index:8;display:none;background:rgba(12,19,32,.88);border:1px solid #334155;border-radius:9px;padding:8px 11px;font-size:13px}.file-info b{color:#fff}.download{color:#9ec5ff;text-decoration:none;margin-left:8px}
#enter{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 14px;border:1px solid #334155;background:#111827;color:#fff;border-radius:10px;display:none;z-index:10}
#pinGate{position:fixed;inset:0;background:rgba(2,5,11,.96);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.pin-card{width:min(380px,100%);background:#0d1627;border:1px solid #33435f;border-radius:18px;padding:22px}.pin-card h2{margin-top:0}.pin-card p{color:#9eacc2;line-height:1.5}.pin-card input{width:100%;height:48px;background:#080f1e;color:#fff;border:1px solid #354662;border-radius:10px;padding:0 14px;font-size:20px;letter-spacing:6px;text-align:center}.pin-card button{width:100%;margin-top:10px;height:46px;border:0;border-radius:10px;background:#4f8cff;color:#fff;font-weight:750}.pin-error{min-height:20px;color:#ff8d8d;font-size:13px;margin-top:9px;text-align:center}
@media(max-width:600px){header{height:44px;padding:0 10px}.file-info{max-width:75%}}
</style>
</head>
<body>
<header><div class="brand">Cast-O-Matic Display</div><div class="room">Room: <b>{{ room or "—" }}</b></div></header>
<div id="screen">
  <div id="placeholder"><div class="placeholder-title">Ready to Receive</div><div class="placeholder-sub">Waiting for the presenter to send content.</div></div>
  <div class="content">
    <iframe id="pdf" style="display:none" title="PDF presentation"></iframe>
    <iframe id="office" style="display:none" title="Office document"></iframe>
    <img id="image" style="display:none" alt="Shared image">
    <video id="video" autoplay playsinline controls style="display:none"></video>
    <audio id="audio" controls style="display:none"></audio>
    <pre id="text" style="display:none"></pre>
  </div>
  <div id="fileInfo" class="file-info"></div>
  <div class="toolbar"><button class="tool" id="fullscreen" type="button">Full Screen</button><button class="tool" id="reconnect" type="button">Reconnect</button></div>
  <button id="enter" type="button">Start Display</button>
</div>
<div id="pinGate">
  <div class="pin-card">
    <h2>Protected Session</h2>
    <p>This Cast-O-Matic room requires the session PIN before content can be received.</p>
    <input id="pinInput" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="PIN">
    <button id="pinSubmit" type="button">Unlock Session</button>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>
<script>
const ROOM={{ room|tojson }};
const socket=io();
const rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
let pc=null,pending=[],senderId=null,directChunks=[],directMeta=null,directBytes=0;
const placeholder=document.getElementById("placeholder");
const pdf=document.getElementById("pdf"),office=document.getElementById("office"),image=document.getElementById("image"),video=document.getElementById("video"),audio=document.getElementById("audio"),text=document.getElementById("text"),enter=document.getElementById("enter"),fileInfo=document.getElementById("fileInfo");

function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function hideContent(){[pdf,office,image,video,audio,text].forEach(x=>x.style.display="none");fileInfo.style.display="none";enter.style.display="none"}
function baseShow(name){hideContent();placeholder.style.display="none";fileInfo.style.display="block";fileInfo.innerHTML="<b>"+escapeHtml(name)+"</b>"}
function fileUrl(f){return "/uploads/"+encodeURIComponent(f)}
function showFile(d){
  if(!d?.filename)return;
  const url=fileUrl(d.filename);
  baseShow(d.original_name);
  if(d.kind==="pdf"){pdf.src=url;pdf.style.display="block";return}
  if(d.kind==="office"){
    const viewer="https://view.officeapps.live.com/op/view.aspx?src="+encodeURIComponent(location.origin+url);
    office.src=viewer;office.style.display="block";
    fileInfo.innerHTML="<b>"+escapeHtml(d.original_name)+"</b><a class='download' href='"+url+"' target='_blank' rel='noopener'>Open / Download</a>";
    return;
  }
  if(d.kind==="image"){image.src=url;image.style.display="block";return}
  if(d.kind==="video"){video.src=url;video.controls=true;video.style.display="block";video.play().catch(()=>enter.style.display="block");return}
  if(d.kind==="audio"){audio.src=url;audio.style.display="block";audio.play().catch(()=>enter.style.display="block");return}
  if(d.kind==="text"){fetch(url).then(r=>{if(!r.ok)throw new Error("Could not load text");return r.text()}).then(v=>{text.textContent=v;text.style.display="block"}).catch(()=>{fileInfo.innerHTML+="<span> Could not preview this file.</span>"});return}
  fileInfo.innerHTML="<b>"+escapeHtml(d.original_name)+"</b><a class='download' href='"+url+"' target='_blank' rel='noopener'>Download / Open</a>";
}
function showLiveStream(){
  hideContent();placeholder.style.display="none";video.style.display="block";video.controls=false;video.muted=false;
}
async function flush(){
  for(const c of pending){try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch(e){}}
  pending=[];
}
function showDirectFile(meta,blob){
  const url=URL.createObjectURL(blob);
  baseShow(meta.name);
  const mime=meta.mime||"application/octet-stream";
  const ext=(meta.name.split(".").pop()||"").toLowerCase();
  if(mime==="application/pdf"||ext==="pdf"){pdf.src=url;pdf.style.display="block";return}
  if(mime.startsWith("image/")){image.src=url;image.style.display="block";return}
  if(mime.startsWith("video/")){video.src=url;video.controls=true;video.style.display="block";video.play().catch(()=>enter.style.display="block");return}
  if(mime.startsWith("audio/")){audio.src=url;audio.controls=true;audio.style.display="block";audio.play().catch(()=>enter.style.display="block");return}
  if(mime.startsWith("text/")){blob.text().then(v=>{text.textContent=v;text.style.display="block"});return}
  fileInfo.innerHTML="<b>"+escapeHtml(meta.name)+"</b><a class='download' href='"+url+"' download='"+escapeHtml(meta.name)+"'>Download</a>";
}
function setupDataChannel(channel){
  channel.binaryType="arraybuffer";
  channel.onmessage=async event=>{
    if(typeof event.data==="string"){
      let msg;try{msg=JSON.parse(event.data)}catch(e){return}
      if(msg.type==="file-start"){
        directMeta=msg;directChunks=[];directBytes=0;
        placeholder.style.display="none";hideContent();fileInfo.style.display="block";
        fileInfo.innerHTML="<b>Receiving directly: "+escapeHtml(msg.name)+"</b>";
      }else if(msg.type==="file-end"&&directMeta){
        const blob=new Blob(directChunks,{type:directMeta.mime||"application/octet-stream"});
        showDirectFile(directMeta,blob);
        directChunks=[];directMeta=null;directBytes=0;
      }
      return;
    }
    if(directMeta){
      const chunk=event.data instanceof ArrayBuffer?event.data:await event.data.arrayBuffer();
      directChunks.push(chunk);directBytes+=chunk.byteLength;
      fileInfo.innerHTML="<b>Receiving directly: "+escapeHtml(directMeta.name)+"</b> &middot; "+Math.round(directBytes/directMeta.size*100)+"%";
    }
  };
}
async function connectWebRTC(offer,id){
  senderId=id||senderId;
  if(pc){try{pc.close()}catch(e){}}
  pending=[];
  pc=new RTCPeerConnection(rtcConfig);
  pc.ondatachannel=e=>setupDataChannel(e.channel);
  pc.ontrack=e=>{
    video.srcObject=e.streams[0]||new MediaStream([e.track]);
    showLiveStream();
    video.play().catch(()=>{enter.style.display="block"});
  };
  pc.onicecandidate=e=>{
    if(e.candidate)socket.emit("ice-candidate",{room:ROOM,target:senderId,candidate:e.candidate.toJSON()});
  };
  pc.onconnectionstatechange=()=>{
    if(!pc)return;
    if(pc.connectionState==="connected")document.title="Live | Cast-O-Matic";
    if(["failed","disconnected","closed"].includes(pc.connectionState)){
      document.title="Cast-O-Matic | Display";
      placeholder.style.display="block";
      placeholder.querySelector(".placeholder-sub").textContent="Connection ended. Reconnect or wait for the presenter.";
    }
  };
  await pc.setRemoteDescription(new RTCSessionDescription(offer));
  await flush();
  const answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit("answer",{room:ROOM,target:senderId,answer:pc.localDescription});
}
socket.on("connect",()=>{if(ROOM)socket.emit("join",{room:ROOM,role:"receiver"})});
socket.on("join_error",d=>{placeholder.style.display="block";placeholder.querySelector(".placeholder-sub").textContent=d?.message||"Could not join this room."});
socket.on("sender_ready",()=>{placeholder.querySelector(".placeholder-sub").textContent="Presenter connected. Waiting for content.";});
socket.on("presentation_update",showFile);
socket.on("offer",d=>connectWebRTC(d.offer,d.sender_id).catch(e=>{console.error(e);placeholder.style.display="block";placeholder.querySelector(".placeholder-sub").textContent="Could not connect to the live cast."}));
socket.on("ice-candidate",async d=>{
  if(!d?.candidate)return;
  if(d.peer_id && senderId && d.peer_id!==senderId)return;
  if(!pc||!pc.remoteDescription)pending.push(d.candidate);
  else{try{await pc.addIceCandidate(new RTCIceCandidate(d.candidate))}catch(e){}}
});
socket.on("peer_left",d=>{
  if(d?.peer_id===senderId){try{pc?.close()}catch(e){}pc=null;senderId=null;hideContent();placeholder.style.display="block";placeholder.querySelector(".placeholder-sub").textContent="Presenter disconnected. Waiting for a new connection."}
});
enter.onclick=()=>{video.play().then(()=>enter.style.display="none").catch(()=>{});audio.play().then(()=>enter.style.display="none").catch(()=>{})};
function submitPin(){
  const pin=pinInput.value.trim();
  if(!/^\d{4,8}$/.test(pin)){pinError.textContent="Enter the 4 to 8 digit session PIN.";return}
  pinError.textContent="Checking PIN...";
  socket.emit("verify_pin",{room:ROOM,pin});
}
pinSubmit.onclick=submitPin;
pinInput.addEventListener("keydown",e=>{if(e.key==="Enter")submitPin()});

document.getElementById("fullscreen").onclick=async()=>{
  try{
    if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
};
document.getElementById("reconnect").onclick=()=>{
  try{pc?.close()}catch(e){}pc=null;senderId=null;pending=[];
  hideContent();placeholder.style.display="block";placeholder.querySelector(".placeholder-sub").textContent="Reconnecting...";
  if(socket.connected)socket.emit("join",{room:ROOM,role:"receiver"});
};
if(!ROOM){placeholder.querySelector(".placeholder-title").textContent="Room Required";placeholder.querySelector(".placeholder-sub").textContent="Open this page using the presenter receiver link or room code."}
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
